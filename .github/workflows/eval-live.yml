name: Live eval

# Manual only: every run is billed (model and guardrail).
on:
  workflow_dispatch:
    inputs:
      chat_model:
        description: anthropic (Claude API) or bedrock-converse
        type: choice
        options: [anthropic, bedrock-converse]
        default: anthropic
      model:
        description: Claude API model, or a Bedrock inference profile ID
        default: claude-haiku-5-5
      cases:
        description: Case id prefixes, comma separated (empty runs all 70)
        default: ""

permissions:
  contents: read
  id-token: write

concurrency: live-eval

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write infra/.env
        env:
          CHAT_MODEL: ${{ inputs.chat_model }}
          MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDRAIL_ID: ${{ vars.BEDROCK_GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.BEDROCK_GUARDRAIL_VERSION }}
        run: |
          {
            echo "IDENTITY_HMAC_SECRET=$(openssl rand -hex 32)"
            echo "SAFELEDGER_CHAT_MODEL=$CHAT_MODEL"
            echo "AWS_REGION=us-east-1"
            echo "BEDROCK_GUARDRAIL_ID=$GUARDRAIL_ID"
            echo "BEDROCK_GUARDRAIL_VERSION=$GUARDRAIL_VERSION"
            if [ "$CHAT_MODEL" = "anthropic" ]; then
              echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
              echo "ANTHROPIC_MODEL=$MODEL"
            else
              echo "BEDROCK_MODEL_ID=$MODEL"
            fi
          } > infra/.env

      - name: Run the live suite
        env:
          EVAL_CASES: ${{ inputs.cases }}
          EVAL_MODEL: ${{ inputs.chat_model == 'anthropic' && format('anthropic:{0}', inputs.model) || inputs.model }}
          EVAL_PRICE_INPUT: ${{ vars.EVAL_PRICE_INPUT || '0.10' }}
          EVAL_PRICE_OUTPUT: ${{ vars.EVAL_PRICE_OUTPUT || '0.50' }}
        run: scripts/eval-live.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/target/eval-report/
          if-no-files-found: ignore
