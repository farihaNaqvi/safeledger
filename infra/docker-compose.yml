name: safeledger

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: safeledger
      # Local-dev default only. Override with POSTGRES_PASSWORD in your shell or an untracked .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeledger}
      # No POSTGRES_DB here on purpose — 01-create-databases.sql creates both
      # safeledger_bank and safeledger_mcp on first boot.
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-bank-api:
    build:
      context: ..
      dockerfile: mock-bank-api/Dockerfile
    environment:
      BANK_DB_URL: jdbc:postgresql://postgres:5432/safeledger_bank
      BANK_DB_USERNAME: safeledger
      BANK_DB_PASSWORD: ${POSTGRES_PASSWORD:-safeledger}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bank-mcp-server:
    build:
      context: ..
      dockerfile: bank-mcp-server/Dockerfile
    environment:
      MCP_DB_URL: jdbc:postgresql://postgres:5432/safeledger_mcp
      MCP_DB_USERNAME: safeledger
      MCP_DB_PASSWORD: ${POSTGRES_PASSWORD:-safeledger}
      BANK_API_URL: http://mock-bank-api:8081
      # Required, no default in the repo. Copy infra/.env.example to infra/.env and set it.
      IDENTITY_HMAC_SECRET: ${IDENTITY_HMAC_SECRET:?Set IDENTITY_HMAC_SECRET (32+ characters) in infra/.env, see infra/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      mock-bank-api:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agent-service:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile
    environment:
      - MCP_SERVER_URL=http://bank-mcp-server:8082
      - IDENTITY_HMAC_SECRET=${IDENTITY_HMAC_SECRET:?Set IDENTITY_HMAC_SECRET (32+ characters) in infra/.env, see infra/.env.example}
      - SAFELEDGER_CHAT_MODEL=${SAFELEDGER_CHAT_MODEL:-bedrock-converse}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      - BEDROCK_GUARDRAIL_ENABLED=${BEDROCK_GUARDRAIL_ENABLED:-true}
      - BEDROCK_GUARDRAIL_ID=${BEDROCK_GUARDRAIL_ID:-}
      - BEDROCK_GUARDRAIL_VERSION=${BEDROCK_GUARDRAIL_VERSION:-DRAFT}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-5-5}
      - MODEL_PRICE_INPUT=${MODEL_PRICE_INPUT:-0.10}
      - MODEL_PRICE_OUTPUT=${MODEL_PRICE_OUTPUT:-0.50}
      - SAFELEDGER_AGENT_TURNTIMEOUT=${SAFELEDGER_AGENT_TURNTIMEOUT:-90s}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mock-bank-api:
        condition: service_healthy
      bank-mcp-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
