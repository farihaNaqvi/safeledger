# Local traces and metrics:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.observability.yml up --build
# Grafana http://localhost:3000, Prometheus http://localhost:9090, Tempo http://localhost:3200

x-tracing: &tracing
  TRACING_EXPORT: "true"
  OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

services:
  mock-bank-api:
    environment: *tracing
  bank-mcp-server:
    environment: *tracing
  agent-service:
    environment: *tracing

  tempo:
    image: grafana/tempo:2.9.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Lets the anonymous viewer open Explore to search traces (local only, bound to localhost).
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/safeledger.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
