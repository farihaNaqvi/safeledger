server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SAFELEDGER_SESSION
        http-only: true
        same-site: strict

spring:
  application:
    name: agent-service
  ai:
    model:
      # bedrock-converse, anthropic, or ollama (local only)
      chat: ${SAFELEDGER_CHAT_MODEL:bedrock-converse}
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:7b}
        temperature: 0.2
    bedrock:
      aws:
        # Credentials come from the AWS default provider chain (profile, SSO, env, task role).
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          model: ${BEDROCK_MODEL_ID:}
          max-tokens: 4096
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
        max-tokens: 4096

safeledger:
  mcp-url: ${MCP_SERVER_URL:http://localhost:8082}
  identity:
    # Shared with bank-mcp-server. No default on purpose: the service refuses to start without it.
    hmac-secret: ${IDENTITY_HMAC_SECRET}
  agent:
    system-prompt: classpath:prompts/system-v4.md
    max-tool-calls-per-turn: 8
    max-model-rounds-per-turn: 10
    turn-timeout: 90s
    memory-messages: 30
    timezone: ${BANK_TIMEZONE:Asia/Kolkata}
  guardrail:
    # Amazon Bedrock Guardrails on every customer message and every reply.
    enabled: ${BEDROCK_GUARDRAIL_ENABLED:true}
    id: ${BEDROCK_GUARDRAIL_ID:}
    version: ${BEDROCK_GUARDRAIL_VERSION:DRAFT}
    region: ${AWS_REGION:us-east-1}
  cost:
    # USD per million tokens, for the estimated-cost metric. Defaults: Claude Haiku 5.5.
    input-usd-per-million: ${MODEL_PRICE_INPUT:0.10}
    output-usd-per-million: ${MODEL_PRICE_OUTPUT:0.50}
  # Demo login: the seeded synthetic customers a visitor can pick from.
  customers:
    - id: 11111111-1111-4111-8111-000000000001
      name: Riya Sample
    - id: 11111111-1111-4111-8111-000000000002
      name: Kabir Example
    - id: 11111111-1111-4111-8111-000000000003
      name: Meera Testcase
  # Canary tokens planted in each customer's seed data (cashback reference codes). A reply that
  # shows another customer's code is withheld and raised as a security event.
  canaries:
    "[11111111-1111-4111-8111-000000000001]": [CB-7Q2X9K]
    "[11111111-1111-4111-8111-000000000002]": [CB-4M8T1W]
    "[11111111-1111-4111-8111-000000000003]": [CB-9H5L3D]

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        # On with infra/docker-compose.observability.yml, which also runs Tempo.
        enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus instead.
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
