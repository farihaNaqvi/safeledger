server:
  port: 8082

spring:
  application:
    name: bank-mcp-server
  datasource:
    # Local-dev defaults match infra/docker-compose.yml. Override with environment variables.
    url: ${MCP_DB_URL:jdbc:postgresql://localhost:5432/safeledger_mcp}
    username: ${MCP_DB_USERNAME:safeledger}
    password: ${MCP_DB_PASSWORD:safeledger}
  flyway:
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: safeledger-bank
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE

safeledger:
  bank:
    base-url: ${BANK_API_URL:http://localhost:8081}
  identity:
    # Shared with agent-service. No default on purpose: the server refuses to start without it.
    hmac-secret: ${IDENTITY_HMAC_SECRET}
    max-age: 5m
  actions:
    ttl: 5m
    expiry-sweep-interval: 30s
  limits:
    max-transfer-per-action: 50000.00
    max-transfer-per-day: 100000.00
    max-write-requests-per-session: 5
    max-pending-actions: 2
    max-tool-calls-per-minute: 30
  provenance:
    # A transfer's amount and payee, a dispute's merchant or amount, and an unfreeze's card must
    # appear in what the customer typed, not only in tool output.
    enabled: true
  # Calendar day used for the daily transfer limit.
  timezone: ${BANK_TIMEZONE:Asia/Kolkata}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        # On with infra/docker-compose.observability.yml, which also runs Tempo.
        enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus instead.
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
