server:
  port: 8081

spring:
  application:
    name: mock-bank-api
  datasource:
    # Local-dev defaults match infra/docker-compose.yml. Override with environment variables.
    url: ${BANK_DB_URL:jdbc:postgresql://localhost:5432/safeledger_bank}
    username: ${BANK_DB_USERNAME:safeledger}
    password: ${BANK_DB_PASSWORD:safeledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

bank:
  # Calendar dates in transaction searches (from/to) are interpreted in this zone.
  timezone: ${BANK_TIMEZONE:Asia/Kolkata}

springdoc:
  writer-with-order-by-keys: true

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
